{% extends 'layouts/base.html' %}

{% block title %}
Dashboard de Captación
{% endblock %}

{% block content %}
    <div class="page-header">
        <div class="page-header-info">
            <div class="page-title">
                Dashboard de Captación
            </div>
            <div class="page-subtitle">
                Socios y concentración
            </div>
        </div>
        <div class="page-filters">
            <form method="GET" class="filter-form">
                <div class="filter-group">
                    <label>
                        Sucursales
                    </label>
                    <select id="sucursalSelect" name="sucursal">
                        {% for sucursal in sucursales %}
                            <option
                                value="{{ sucursal }}"
                                {% if sucursal == selected_sucursal %}selected{% endif %}
                            >
                                {{ sucursal }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="filter-group">
                    <label>
                        Año
                    </label>
                    <select id="anioSelect" name="anio">
                        {% for anio in anios %}
                            <option
                                value="{{ anio }}"
                                {% if anio == selected_anio %}selected{% endif %}
                            >
                                {{ anio }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="filter-group">
                    <label>
                        Mes
                    </label>
                    <select id="mesSelect" name="mes">
                        {% for mes in meses %}
                            <option
                                value="{{ mes }}"
                                {% if mes == selected_mes %}selected{% endif %}
                            >
                                {{ mes|upper }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
            </form>
        </div>
    </div>
    <!-- -->
    <div class="sec">Ranking socios</div>
    <div class="g2">
        <div class="card a-c"><div class="card-hd"><span class="card-title">Top 10 socios por saldo de captación</span><span class="ctag">$M</span></div><div id="chart_top_socios_por_saldo" style="min-height:220px"></div></div>
        <div class="card a-y"><div class="card-hd"><span class="card-title">Top 10 socios con más cuentas</span></div><div id="chart_top_socios_por_numero_cuentas" style="min-height:220px"></div></div>
    </div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
<script src="{{ url_for('static',filename='js/charts/chart-builder.js') }}"></script>
<script src="{{ url_for('static',filename='js/dashboard/captacion/sociosconcentracion.js') }}"></script>
{% endblock %}
