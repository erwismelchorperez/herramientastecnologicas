{% extends 'layouts/auth_base.html' %}

{% block content %}

<div class="container vh-100 d-flex justify-content-center align-items-center">

    <div class="card shadow p-5" style="width: 420px;">

        <h2 class="mb-4 text-center">
            Quantiva
        </h2>

        <form method="POST">

            <div class="mb-3">

                <label>
                    Usuario
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    required
                >

            </div>

            <div class="mb-3">

                <label>
                    Contraseña
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    required
                >

            </div>

            <button
                class="btn btn-success w-100"
                type="submit"
            >
                Iniciar sesión
            </button>

        </form>

    </div>

</div>

{% endblock %}
