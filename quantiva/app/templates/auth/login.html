{% extends 'layouts/auth_base.html' %}

{% block content %}

<div class="login-page">

    <div class="login-card">

        <div class="login-brand">

            <div class="brand-icon">
                <i class="bi bi-graph-up-arrow"></i>
            </div>

            <div>

                <div class="login-title">
                    Quantiva
                </div>

                <div class="login-subtitle">
                    Financial Intelligence Platform
                </div>

            </div>

        </div>

        <form method="POST">

            <div class="form-group">

                <label>
                    Usuario
                </label>

                <input
                    type="text"
                    name="username"
                    required
                >

            </div>

            <div class="form-group">

                <label>
                    Contraseña
                </label>

                <input
                    type="password"
                    name="password"
                    required
                >

            </div>

            <button
                type="submit"
                class="login-btn"
            >
                Iniciar sesión
            </button>

        </form>

    </div>

</div>

{% endblock %}
